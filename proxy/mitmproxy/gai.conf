# gai.conf for the mitmproxy container — prefer IPv4 over IPv6.
#
# WHY THIS FILE EXISTS
#
# mitmproxy connects upstream through Python's asyncio, which calls glibc
# getaddrinfo(3) and then tries the returned addresses IN ORDER, waiting out the
# kernel's connect timeout on each. It does NOT implement Happy Eyeballs (RFC
# 8305), the racing fallback that makes `curl` shrug off a broken IPv6 path.
#
# So on any host that ADVERTISES IPv6 but cannot route it — a very common state:
# the router sends RAs, the upstream is dead or filtered — every allowlisted
# host with a AAAA record hangs for minutes, while IPv4-only hosts work fine.
# That failure is maximally confusing from inside the sandbox: github.com
# answers instantly and pypi.org hangs forever, which reads like a broken
# allowlist rather than a broken network. It cost an evening to find.
#
# Preferring IPv4 here makes the sandbox's egress independent of whether the
# host's IPv6 happens to work. It is scoped to this container: the host's own
# resolution order is untouched.
#
# NOTE ON THE FORMAT: per gai.conf(5), if ANY precedence line is present the
# built-in table is discarded entirely. So this is the full default table from
# RFC 3484/6724 with one value changed — the last line raised from 10 to 100,
# which floats IPv4-mapped addresses above everything else. Do not trim it to
# just that line, or the remaining prefixes lose their relative order.
#
# If this host ever gets working IPv6, deleting this file (and its mount in
# net-up.sh) restores standard behaviour.

precedence  ::1/128        50
precedence  ::/0           40
precedence  2002::/16      30
precedence  ::/96          20
precedence  ::ffff:0:0/96  100
